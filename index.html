<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batutta - بتوتا</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Tajawal',sans-serif}</style>
</head>
<body class="bg-[#FFF8F0] min-h-screen">
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp, doc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC88OTsrgAVLHcc1mrYeG0Gjsq0S8r9wkw",
  authDomain: "batutta-social.firebaseapp.com",
  projectId: "batutta-social",
  storageBucket: "batutta-social.firebasestorage.app",
  messagingSenderId: "954045535190",
  appId: "1:954045535190:web:8b17fd7b0def29e4348a77"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = JSON.parse(localStorage.getItem('batutta_user') || 'null');

function renderLogin(){
  document.getElementById('app').innerHTML = `
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-[30px] p-8 w-full max-w-sm shadow-xl">
      <h1 class="text-4xl font-black text-center mb-2">بتوتا ✨</h1>
      <p class="text-center text-gray-500 mb-6">شبكة بتوتا الاجتماعية</p>
      <input id="username" placeholder="اسمك (مثلا: سارة)" class="w-full p-4 rounded-full border-2 border-orange-100 mb-4 text-center font-bold outline-none focus:border-orange-400">
      <button onclick="login()" class="w-full bg-black text-white p-4 rounded-full font-bold text-lg">دخول 🚀</button>
    </div>
  </div>`;
}

function renderHome(){
  document.getElementById('app').innerHTML = `
  <header class="sticky top-0 bg-white/80 backdrop-blur-md p-4 flex justify-between items-center border-b z-10">
    <h1 class="font-black text-xl">بتوتا</h1>
    <div class="flex gap-2 items-center"><span class="font-bold text-sm">👋 ${currentUser.name}</span><button onclick="logout()" class="text-xs bg-gray-100 px-3 py-1 rounded-full">خروج</button></div>
  </header>
  <div class="max-w-lg mx-auto p-4">
    <div class="bg-white rounded-[24px] p-4 shadow-sm mb-4">
      <textarea id="postText" placeholder="شنو في بالك يا ${currentUser.name}؟" class="w-full p-3 bg-gray-50 rounded-2xl outline-none min-h-[80px]"></textarea>
      <button onclick="createPost()" class="mt-3 w-full bg-black text-white p-3 rounded-full font-bold">نشر ✨</button>
    </div>
    <div id="posts" class="space-y-4"></div>
  </div>`;
  listenPosts();
}

window.login = () => {
  const name = document.getElementById('username').value.trim();
  if(!name) return alert('اكتبي اسمك');
  currentUser = { name, id: Date.now().toString() };
  localStorage.setItem('batutta_user', JSON.stringify(currentUser));
  renderHome();
}
window.logout = () => { localStorage.removeItem('batutta_user'); renderLogin(); }

window.createPost = async () => {
  const text = document.getElementById('postText').value.trim();
  if(!text) return;
  await addDoc(collection(db, "posts"), { text, author: currentUser.name, authorId: currentUser.id, likes: [], createdAt: serverTimestamp() });
  document.getElementById('postText').value = '';
}

function listenPosts(){
  const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
  onSnapshot(q, (snap) => {
    const postsDiv = document.getElementById('posts');
    postsDiv.innerHTML = '';
    snap.forEach(d => {
      const p = d.data();
      const id = d.id;
      const liked = p.likes?.includes(currentUser.id);
      postsDiv.innerHTML += `
      <div class="bg-white rounded-[24px] p-5 shadow-sm">
        <div class="font-bold mb-2">👤 ${p.author}</div>
        <div class="text-gray-800 mb-3 leading-relaxed">${p.text}</div>
        <button onclick="toggleLike('${id}', ${JSON.stringify(p.likes || []).replace(/"/g,'&quot;')})" class="text-sm font-bold ${liked?'text-red-500':'text-gray-400'}">
          ${liked?'❤️':'🤍'} ${p.likes?.length||0} إعجاب
        </button>
      </div>`;
    });
  });
}

window.toggleLike = async (postId, likes) => {
  const ref = doc(db, "posts", postId);
  if(likes.includes(currentUser.id)){
    await updateDoc(ref, { likes: arrayRemove(currentUser.id) });
  } else {
    await updateDoc(ref, { likes: arrayUnion(currentUser.id) });
  }
}

if(currentUser) renderHome(); else renderLogin();
</script>
</body>
</html>
