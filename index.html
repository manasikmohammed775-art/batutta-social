<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batutta</title>
<link rel="icon" href="icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Tajawal',sans-serif} *{transition:.2s}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#fff7ed] min-h-screen">

<button id="langBtn" class="fixed top-3 left-3 z-50 bg-white border rounded-full w-10 h-10 shadow">🌐</button>

<div id="authScreen" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-[32px] shadow-2xl w-full max-w-md p-8 border border-orange-100">
    <div class="text-center mb-6">
      <img src="icon-192.png" class="w-20 h-20 mx-auto mb-3 rounded-2xl shadow"/>
      <h1 class="text-4xl font-extrabold text-[#ff7a00]">Batutta</h1>
      <p class="text-gray-500 mt-1">شبكتك الاجتماعية العالمية</p>
    </div>
    <div class="space-y-3">
      <input id="displayName" type="text" placeholder="اسمك" class="w-full p-4 rounded-2xl border border-gray-200 outline-none">
      <input id="email" type="email" placeholder="الإيميل" class="w-full p-4 rounded-2xl border border-gray-200 outline-none">
      <input id="password" type="password" placeholder="كلمة السر" class="w-full p-4 rounded-2xl border border-gray-200 outline-none">
      <div class="pt-2">
        <p class="text-sm font-bold mb-2">النوع:</p>
        <div class="grid grid-cols-2 gap-3">
          <button id="genderMale" class="genderBtn border-2 border-gray-200 p-3 rounded-2xl font-bold" data-gender="male">👨 ذكر</button>
          <button id="genderFemale" class="genderBtn border-2 border-gray-200 p-3 rounded-2xl font-bold" data-gender="female">👩 أنثى</button>
        </div>
      </div>
      <button id="signupBtn" class="w-full bg-[#ff7a00] text-white p-4 rounded-2xl font-bold mt-2">حساب جديد</button>
      <button id="loginBtn" class="w-full bg-white border-2 border-gray-200 p-4 rounded-2xl font-bold">دخول</button>
      <p id="authError" class="text-red-500 text-sm text-center"></p>
    </div>
  </div>
</div>

<div id="appScreen" class="hidden">
  <header class="bg-white sticky top-0 z-10 border-b border-orange-100">
    <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <img src="icon-192.png" class="w-9 h-9 rounded-xl"/><span class="font-extrabold text-xl text-[#ff7a00]">Batutta</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="userGenderBadge" class="text-xs bg-orange-100 text-[#ff7a00] px-2 py-1 rounded-full"></span>
        <img id="userAvatar" class="w-9 h-9 rounded-full bg-orange-100 object-cover"/>
        <button id="logoutBtn" class="text-sm text-gray-500">خروج</button>
      </div>
    </div>
  </header>
  <main class="max-w-3xl mx-auto p-4">
    <div class="bg-white rounded-[24px] p-5 shadow-sm border border-orange-50 mb-6">
      <div class="flex gap-3">
        <img id="createAvatar" class="w-10 h-10 rounded-full bg-orange-100 object-cover"/>
        <textarea id="postText" class="flex-1 bg-[#fff7ed] rounded-2xl p-4 min-h-[80px] outline-none" placeholder="شنو في بالك؟"></textarea>
      </div>
      <div id="postImagePreview" class="hidden mt-3 relative">
        <img id="previewImg" class="w-full rounded-2xl max-h-80 object-cover"/>
        <button id="removeImg" class="absolute top-2 left-2 bg-black/60 text-white rounded-full w-8 h-8">×</button>
      </div>
      <div class="flex justify-between items-center mt-4">
        <label class="cursor-pointer text-[#ff7a00] font-bold">📷 صورة
          <input type="file" id="imageInput" accept="image/*" class="hidden">
        </label>
        <button id="publishBtn" class="bg-[#ff7a00] text-white px-8 py-3 rounded-2xl font-bold">نشر</button>
      </div>
    </div>
    <div id="feed" class="space-y-4"></div>
  </main>
</div>

<script>
const SUPABASE_URL = "https://jhdhysqixxjjwrgpdqfd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_OlTsulPNb1L4P_Oka1wtkQ_6dJVqEPi";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let selectedGender = null;
let selectedImageBase64 = null;
let currentProfile = null;

document.querySelectorAll('.genderBtn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.genderBtn').forEach(b=>b.classList.remove('border-[#ff7a00]','bg-orange-50'));
    btn.classList.add('border-[#ff7a00]','bg-orange-50');
    selectedGender = btn.dataset.gender;
  };
});

function show(id){ ['authScreen','appScreen'].forEach(s=>document.getElementById(s).classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }

async function checkUser(){
  const { data: { session } } = await supabase.auth.getSession();
  if(!session){ show('authScreen'); return; }
  const { data } = await supabase.from('users').select('*').eq('uid', session.user.id).single();
  if(!data){ 
    // لو المستخدم موجود في Auth بس ما في جدول users
    show('authScreen'); 
    return; 
  }
  currentProfile = data;
  document.getElementById('userAvatar').src = data.photoURL || data.avatar_url || `https://ui-avatars.com/api/?name=${data.displayName}&background=ff7a00&color=fff`;
  document.getElementById('createAvatar').src = document.getElementById('userAvatar').src;
  document.getElementById('userGenderBadge').textContent = data.gender==='female' ? '👩 أنثى' : '👨 ذكر';
  show('appScreen'); loadFeed();
}
checkUser();
supabase.auth.onAuthStateChange(()=> checkUser());

document.getElementById('signupBtn').onclick = async ()=>{
  const email=document.getElementById('email').value.trim(), pass=document.getElementById('password').value, name=document.getElementById('displayName').value.trim();
  if(!name) return alert('اكتب اسمك');
  if(!selectedGender) return alert('اختار النوع');
  const { data, error } = await supabase.auth.signUp({ email, password: pass });
  if(error){ document.getElementById('authError').textContent=error.message; return; }
  if(data.user){
    await supabase.from('users').insert({ uid: data.user.id, email, displayName: name, name: name, gender: selectedGender, photoURL: "" });
  }
  alert('تم! اعملي تسجيل دخول هسه');
};

document.getElementById('loginBtn').onclick = async ()=>{
  const { error } = await supabase.auth.signInWithPassword({ email: document.getElementById('email').value.trim(), password: document.getElementById('password').value });
  if(error) document.getElementById('authError').textContent=error.message;
};

document.getElementById('logoutBtn').onclick = async ()=>{ await supabase.auth.signOut(); show('authScreen'); };

document.getElementById('imageInput').onchange = (e)=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader(); r.onload=ev=>{ selectedImageBase64=ev.target.result; document.getElementById('previewImg').src=selectedImageBase64; document.getElementById('postImagePreview').classList.remove('hidden'); }; r.readAsDataURL(file);
};
document.getElementById('removeImg').onclick = ()=>{ selectedImageBase64=null; document.getElementById('postImagePreview').classList.add('hidden'); };

document.getElementById('publishBtn').onclick = async ()=>{
  const text=document.getElementById('postText').value.trim(); if(!text && !selectedImageBase64) return;
  const btn=document.getElementById('publishBtn'); btn.disabled=true;
  const { data: { session } } = await supabase.auth.getSession();
  await supabase.from('posts').insert({ text, content: text, image: selectedImageBase64||null, image_url: selectedImageBase64||null, authorId: session.user.id, author_id: session.user.id, authorName: currentProfile.displayName, author_name: currentProfile.displayName, authorPhoto: currentProfile.photoURL||"", authorGender: currentProfile.gender, likes: [] });
  document.getElementById('postText').value=""; document.getElementById('removeImg').click(); loadFeed(); btn.disabled=false;
};

async function loadFeed(){
  const { data } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
  const feed=document.getElementById('feed'); feed.innerHTML="";
  const { data: { session } } = await supabase.auth.getSession();
  (data||[]).forEach(p=>{
    const liked = p.likes?.includes(session?.user.id);
    const genderIcon = p.authorGender==='female'?'👩':'👨';
    const el=document.createElement('div'); el.className="bg-white rounded-[24px] p-5 shadow-sm border border-orange-50";
    el.innerHTML=`<div class="flex gap-3 items-center mb-3"><img src="${p.authorPhoto||p.author_photo||`https://ui-avatars.com/api/?name=${p.authorName||p.author_name}&background=ff7a00&color=fff`}" class="w-10 h-10 rounded-full"/><div><div class="font-bold flex gap-2">${p.authorName||p.author_name} <span class="text-xs bg-orange-50 px-2 rounded-full">${genderIcon}</span></div><div class="text-xs text-gray-400">${new Date(p.created_at).toLocaleString()}</div></div></div>${p.text||p.content?`<p class="mb-3">${p.text||p.content}</p>`:''}${p.image||p.image_url?`<img src="${p.image||p.image_url}" class="w-full rounded-2xl mb-3 max-h-[500px] object-cover"/>`:''}<div class="flex gap-6 pt-2 border-t"><button class="likeBtn font-bold ${liked?'text-[#ff7a00]':'text-gray-500'}">${liked?'❤️':'🤍'} ${p.likes?.length||0}</button></div>`;
    el.querySelector('.likeBtn').onclick=async()=>{
      let newLikes = liked ? p.likes.filter(id=>id!==session.user.id) : [...(p.likes||[]), session.user.id];
      await supabase.from('posts').update({ likes: newLikes }).eq('id', p.id); loadFeed();
    };
    feed.appendChild(el);
  });
}

document.getElementById('langBtn').onclick=()=>{ alert('اللغة ح نرجعها بعد ما يشتغل'); }
</script>
</body>
</html>
