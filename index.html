<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Batutta 🦆</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet"><style>*{font-family:'Tajawal',sans-serif}</style></head><body class="bg-[#fff7ed] min-h-screen"><header class="sticky top-0 z-20 bg-gradient-to-r from-[#ff7a00] to-[#ff9d2f] text-white p-3 flex justify-between"><span class="font-black text-xl">🦆 batutta</span><span class="text-sm bg-white/20 px-3 py-1 rounded-full">متصل 🟢</span></header><main class="max-w-[680px] mx-auto pb-20"><div class="bg-white m-2 p-3 rounded-[18px] flex gap-3 overflow-x-auto"><div class="min-w-[60px] text-center"><div class="w-[60px] h-[60px] rounded-full border-2 border-dashed border-[#ff7a00] flex items-center justify-center text-2xl">+</div><small>قصتك</small></div><div class="min-w-[60px] text-center"><div class="w-[60px] h-[60px] rounded-full p-[3px] bg-gradient-to-tr from-yellow-400 to-[#ff7a00]"><img src="https://i.pravatar.cc/100?img=5" class="w-full h-full rounded-full border-2 border-white"></div><small>سارة</small></div></div><div class="bg-white m-2 p-4 rounded-[18px] shadow-sm"><div class="flex gap-2"><div class="w-10 h-10 rounded-full bg-[#ffedd5] flex items-center justify-center font-black text-[#ff7a00]">ب</div><input id="postText" placeholder="بماذا تفكر يا بطوطة؟" class="flex-1 bg-[#fff7ed] border border-[#ffe4c0] rounded-full px-4 py-2 outline-none"></div><div class="flex gap-2 mt-3"><label class="bg-[#fff7ed] text-[#ff7a00] px-4 py-2 rounded-full cursor-pointer">📷 صورة<input type="file" id="fileInput" accept="image/*" class="hidden"></label><button onclick="createPost()" id="postBtn" class="mr-auto bg-[#ff7a00] text-white px-6 py-2 rounded-full font-bold">نشر 🚀</button></div><img id="preview" class="hidden w-full rounded-xl mt-3"></div><div id="postsContainer"></div></main><script>const firebaseConfig={apiKey:"AIzaSyC88OTsrgAVLHcc1mrYeG0Gjsq0S8r9wkw",authDomain:"batutta-social.firebaseapp.com",projectId:"batutta-social",storageBucket:"batutta-social.firebasestorage.app",messagingSenderId:"954045535190",appId:"1:954045535190:web:8b17fd7b0def29e4348a77"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const storage=firebase.storage();const auth=firebase.auth();let currentUser=null;let selectedFile=null;auth.signInAnonymously().then(r=>currentUser=r.user);document.getElementById('fileInput').addEventListener('change',e=>{selectedFile=e.target.files[0];if(!selectedFile)return;const reader=new FileReader();reader.onload=ev=>{const p=document.getElementById('preview');p.src=ev.target.result;p.classList.remove('hidden');};reader.readAsDataURL(selectedFile);});async function createPost(){const text=document.getElementById('postText').value.trim();if(!text&&!selectedFile)return alert('اكتب شي');const btn=document.getElementById('postBtn');btn.textContent='جاري...';btn.disabled=true;try{let imageUrl="";if(selectedFile){const ref=storage.ref(`posts/${Date.now()}_${selectedFile.name}`);await ref.put(selectedFile);imageUrl=await ref.getDownloadURL();}await db.collection('posts').add({text,image:imageUrl,name:'بطوطة',likes:0,likedBy:[],createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('postText').value="";document.getElementById('preview').classList.add('hidden');selectedFile=null;document.getElementById('fileInput').value="";}catch(e){alert(e.message);}btn.textContent='نشر 🚀';btn.disabled=false;}db.collection('posts').orderBy('createdAt','desc').onSnapshot(snap=>{const container=document.getElementById('postsContainer');if(snap.empty){container.innerHTML='<div class="bg-white m-2 p-8 rounded-[18px] text-center text-gray-400">لسه مافي بوستات، كوني أول واحدة 🧡</div>';return;}container.innerHTML=snap.docs.map(docSnap=>{const p=docSnap.data();const id=docSnap.id;const liked=p.likedBy?.includes(currentUser?.uid);return`<div class="bg-white m-2 p-4 rounded-[18px] shadow-sm"><div class="flex gap-2 items-center"><div class="w-8 h-8 rounded-full bg-[#ffedd5] flex items-center justify-center font-bold text-[#ff7a00]">ب</div><b>${p.name||'بطوطة'}</b></div><div class="mt-2">${(p.text||'').replace(/</g,'&lt;')}</div>${p.image?`<img src="${p.image}" class="w-full rounded-xl mt-2">`:''}<div class="flex gap-4 mt-3 border-t pt-2"><button onclick="likePost('${id}')" class="font-bold ${liked?'text-[#ff7a00]':''}">${liked?'🧡':'🤍'} ${p.likes||0}</button><button class="text-gray-500">💬 تعليق</button></div></div>`;}).join('');});async function likePost(id){const ref=db.collection('posts').doc(id);const snap=await ref.get();const data=snap.data();if(data.likedBy?.includes(currentUser.uid)){await ref.update({likes:firebase.firestore.FieldValue.increment(-1),likedBy:firebase.firestore.FieldValue.arrayRemove(currentUser.uid)});}else{await ref.update({likes:firebase.firestore.FieldValue.increment(1),likedBy:firebase.firestore.FieldValue.arrayUnion(currentUser.uid)});}}</script></body></html>
