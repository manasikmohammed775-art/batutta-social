<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batutta-batutta </title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#ff7a00">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Tajawal',sans-serif} *{transition:.2s}</style>
</head>
<body class="bg-[#fff7ed] min-h-screen">

<!-- LANGUAGE SWITCHER -->
<button id="langBtn" class="fixed top-3 left-3 z-50 bg-white border rounded-full w-10 h-10 shadow">🌐</button>

<!-- AUTH -->
<div id="authScreen" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-[32px] shadow-2xl w-full max-w-md p-8 border border-orange-100">
    <div class="text-center mb-6">
      <img src="icon-192.png" class="w-20 h-20 mx-auto mb-3 rounded-2xl shadow"/>
      <h1 class="text-4xl font-extrabold text-[#ff7a00]" data-i18n="appName">Batutta</h1>
      <p class="text-gray-500 mt-1" data-i18n="tagline">شبكتك الاجتماعية العالمية</p>
    </div>

    <div class="space-y-3">
      <input id="displayName" type="text" placeholder="اسمك" class="w-full p-4 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-orange-400 outline-none" data-i18n-ph="namePh">
      <input id="email" type="email" placeholder="الإيميل" class="w-full p-4 rounded-2xl border border-gray-200 outline-none">
      <input id="password" type="password" placeholder="كلمة السر" class="w-full p-4 rounded-2xl border border-gray-200 outline-none" data-i18n-ph="passPh">
      
      <div class="pt-2">
        <p class="text-sm font-bold mb-2" data-i18n="genderQ">النوع:</p>
        <div class="grid grid-cols-2 gap-3">
          <button id="genderMale" class="genderBtn border-2 border-gray-200 p-3 rounded-2xl font-bold" data-gender="male">👨 <span data-i18n="male">ذكر</span></button>
          <button id="genderFemale" class="genderBtn border-2 border-gray-200 p-3 rounded-2xl font-bold" data-gender="female">👩 <span data-i18n="female">أنثى</span></button>
        </div>
      </div>

      <button id="signupBtn" class="w-full bg-[#ff7a00] text-white p-4 rounded-2xl font-bold mt-2" data-i18n="signup">حساب جديد</button>
      <button id="loginBtn" class="w-full bg-white border-2 border-gray-200 p-4 rounded-2xl font-bold" data-i18n="login">دخول</button>
      <div class="text-center text-gray-400 text-sm" data-i18n="or">أو</div>
      <button id="googleBtn" class="w-full bg-white border p-4 rounded-2xl font-bold">🔵 Google</button>
      <p id="authError" class="text-red-500 text-sm text-center"></p>
    </div>
  </div>
</div>

<!-- VERIFY -->
<div id="verifyScreen" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-[32px] p-8 max-w-md w-full text-center shadow">
    <h2 class="text-2xl font-bold mb-3" data-i18n="verifyTitle">تأكيد الإيميل 📧</h2>
    <p class="text-gray-600 mb-4" data-i18n="verifyText">رسلنا ليك رابط تأكيد في إيميلك.</p>
    <button id="resendBtn" class="bg-orange-100 text-[#ff7a00] px-6 py-3 rounded-xl font-bold" data-i18n="resend">إعادة إرسال</button>
    <button id="backToLogin" class="block mx-auto mt-4 text-gray-500" data-i18n="back">رجوع</button>
  </div>
</div>

<!-- APP -->
<div id="appScreen" class="hidden">
  <header class="bg-white sticky top-0 z-10 border-b border-orange-100">
    <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <img src="icon-192.png" class="w-9 h-9 rounded-xl"/><span class="font-extrabold text-xl text-[#ff7a00]">Batutta</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="userGenderBadge" class="text-xs bg-orange-100 text-[#ff7a00] px-2 py-1 rounded-full"></span>
        <img id="userAvatar" class="w-9 h-9 rounded-full bg-orange-100 object-cover"/>
        <button id="logoutBtn" class="text-sm text-gray-500" data-i18n="logout">خروج</button>
      </div>
    </div>
  </header>
  <main class="max-w-3xl mx-auto p-4">
    <div class="bg-white rounded-[24px] p-5 shadow-sm border border-orange-50 mb-6">
      <div class="flex gap-3">
        <img id="createAvatar" class="w-10 h-10 rounded-full bg-orange-100 object-cover"/>
        <textarea id="postText" class="flex-1 bg-[#fff7ed] rounded-2xl p-4 min-h-[80px] outline-none" data-i18n-ph="whatMind"></textarea>
      </div>
      <div id="postImagePreview" class="hidden mt-3 relative">
        <img id="previewImg" class="w-full rounded-2xl max-h-80 object-cover"/>
        <button id="removeImg" class="absolute top-2 left-2 bg-black/60 text-white rounded-full w-8 h-8">×</button>
      </div>
      <div class="flex justify-between items-center mt-4">
        <label class="cursor-pointer text-[#ff7a00] font-bold">📷 <span data-i18n="image">صورة</span>
          <input type="file" id="imageInput" accept="image/*" class="hidden">
        </label>
        <button id="publishBtn" class="bg-[#ff7a00] text-white px-8 py-3 rounded-2xl font-bold" data-i18n="postBtn">نشر</button>
      </div>
    </div>
    <div id="feed" class="space-y-4"></div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, sendEmailVerification, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot, doc, updateDoc, arrayUnion, arrayRemove, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔴🔴🔴 ضعي كونفج Firebase الحقيقي هنا 🔴🔴🔴
const firebaseConfig = {
  apiKey: "PUT_YOUR_API_KEY_HERE",
  authDomain: "batutta-social.firebaseapp.com",
  projectId: "batutta-social",
  storageBucket: "batutta-social.firebasestorage.app",
  messagingSenderId: "PUT_YOUR_SENDER_ID",
  appId: "PUT_YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// i18n
const I18N = {
  ar: {appName:"batutta", tagline:"شبكتك الاجتماعية العالمية", namePh:"اسمك", passPh:"كلمة السر", genderQ:"النوع:", male:"ذكر", female:"أنثى", signup:"حساب جديد", login:"دخول", or:"أو", verifyTitle:"تأكيد الإيميل 📧", verifyText:"رسلنا ليك رابط تأكيد في إيميلك.", resend:"إعادة إرسال", back:"رجوع", logout:"خروج", whatMind:"شنو في بالك؟", image:"صورة", postBtn:"نشر"},
  en: {appName:"Batutta", tagline:"Your Global Social Network", namePh:"Your name", passPh:"Password", genderQ:"Gender:", male:"Male", female:"Female", signup:"Sign Up", login:"Login", or:"or", verifyTitle:"Verify Email 📧", verifyText:"We sent a verification link to your email.", resend:"Resend", back:"Back", logout:"Logout", whatMind:"What's on your mind?", image:"Image", postBtn:"Post"}
};
let lang = localStorage.getItem('batutta_lang') || (navigator.language.startsWith('ar')?'ar':'en');
function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{ const k=el.getAttribute('data-i18n'); if(I18N[lang][k]) el.textContent=I18N[lang][k]; });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ const k=el.getAttribute('data-i18n-ph'); if(I18N[lang][k]) el.placeholder=I18N[lang][k]; });
}
applyLang();
document.getElementById('langBtn').onclick=()=>{ lang = lang==='ar'?'en':'ar'; localStorage.setItem('batutta_lang', lang); applyLang(); };

let selectedGender = null;
let selectedImageBase64 = null;
let currentProfile = null;

document.querySelectorAll('.genderBtn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.genderBtn').forEach(b=>b.classList.remove('border-[#ff7a00]','bg-orange-50'));
    btn.classList.add('border-[#ff7a00]','bg-orange-50');
    selectedGender = btn.dataset.gender;
  };
});

function show(id){ ['authScreen','verifyScreen','appScreen'].forEach(s=>document.getElementById(s).classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }

onAuthStateChanged(auth, async (user)=>{
  if(!user){ show('authScreen'); return; }
  if(!user.emailVerified && user.providerData[0]?.providerId !== 'google.com'){ show('verifyScreen'); return; }
  const ref = doc(db,"users",user.uid);
  let snap = await getDoc(ref);
  if(!snap.exists()){
    await setDoc(ref,{uid:user.uid,email:user.email,displayName:user.displayName||document.getElementById('displayName').value||user.email.split('@')[0], gender: selectedGender||'male', photoURL:user.photoURL||"", createdAt:serverTimestamp()});
    snap = await getDoc(ref);
  }
  currentProfile = snap.data();
  document.getElementById('userAvatar').src = currentProfile.photoURL || `https://ui-avatars.com/api/?name=${currentProfile.displayName}&background=ff7a00&color=fff`;
  document.getElementById('createAvatar').src = document.getElementById('userAvatar').src;
  document.getElementById('userGenderBadge').textContent = currentProfile.gender==='female' ? (lang==='ar'?'👩 أنثى':'👩 Female') : (lang==='ar'?'👨 ذكر':'👨 Male');
  show('appScreen'); loadFeed();
});

document.getElementById('signupBtn').onclick = async ()=>{
  const email=document.getElementById('email').value.trim(), pass=document.getElementById('password').value, name=document.getElementById('displayName').value.trim();
  if(!name) return alert(lang==='ar'?'اكتب اسمك':'Enter name');
  if(!selectedGender) return alert(lang==='ar'?'اختار النوع ذكر أو أنثى':'Select gender');
  try{
    const cred = await createUserWithEmailAndPassword(auth,email,pass);
    await setDoc(doc(db,"users",cred.user.uid),{uid:cred.user.uid,email,displayName:name,gender:selectedGender,photoURL:"",createdAt:serverTimestamp()});
    await sendEmailVerification(cred.user); show('verifyScreen');
  }catch(e){ document.getElementById('authError').textContent=e.message; }
};
document.getElementById('loginBtn').onclick = async ()=>{
  try{ await signInWithEmailAndPassword(auth, document.getElementById('email').value.trim(), document.getElementById('password').value); }
  catch(e){ document.getElementById('authError').textContent=e.message; }
};
document.getElementById('googleBtn').onclick = async ()=>{
  try{
    const prov=new GoogleAuthProvider(); await signInWithPopup(auth,prov);
  }catch(e){ document.getElementById('authError').textContent=e.message; }
};
document.getElementById('resendBtn').onclick = async ()=>{ if(auth.currentUser) await sendEmailVerification(auth.currentUser); alert('Sent!'); };
document.getElementById('backToLogin').onclick = ()=> signOut(auth);
document.getElementById('logoutBtn').onclick = ()=> signOut(auth);

document.getElementById('imageInput').onchange = (e)=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader(); r.onload=ev=>{ selectedImageBase64=ev.target.result; document.getElementById('previewImg').src=selectedImageBase64; document.getElementById('postImagePreview').classList.remove('hidden'); }; r.readAsDataURL(file);
};
document.getElementById('removeImg').onclick = ()=>{ selectedImageBase64=null; document.getElementById('postImagePreview').classList.add('hidden'); };

document.getElementById('publishBtn').onclick = async ()=>{
  const text=document.getElementById('postText').value.trim(); if(!text && !selectedImageBase64) return;
  const btn=document.getElementById('publishBtn'); btn.disabled=true;
  try{
    await addDoc(collection(db,"posts"),{text, image:selectedImageBase64||null, authorId:auth.currentUser.uid, authorName:currentProfile.displayName, authorPhoto:currentProfile.photoURL||"", authorGender:currentProfile.gender, likes:[], createdAt:serverTimestamp()});
    document.getElementById('postText').value=""; document.getElementById('removeImg').click();
  }catch(e){ alert(e.message); }
  btn.disabled=false;
};

function loadFeed(){
  const q=query(collection(db,"posts"), orderBy("createdAt","desc"));
  onSnapshot(q, (snap)=>{
    const feed=document.getElementById('feed'); feed.innerHTML="";
    snap.forEach(d=>{
      const p=d.data(), id=d.id, liked=p.likes?.includes(auth.currentUser.uid);
      const genderIcon = p.authorGender==='female'?'👩':'👨';
      const el=document.createElement('div'); el.className="bg-white rounded-[24px] p-5 shadow-sm border border-orange-50";
      el.innerHTML=`<div class="flex gap-3 items-center mb-3"><img src="${p.authorPhoto||`https://ui-avatars.com/api/?name=${p.authorName}&background=ff7a00&color=fff`}" class="w-10 h-10 rounded-full"/><div><div class="font-bold flex gap-2">${p.authorName} <span class="text-xs bg-orange-50 px-2 rounded-full">${genderIcon}</span></div><div class="text-xs text-gray-400">${p.createdAt?.toDate?p.createdAt.toDate().toLocaleString():'الآن'}</div></div></div>${p.text?`<p class="mb-3">${p.text}</p>`:''}${p.image?`<img src="${p.image}" class="w-full rounded-2xl mb-3 max-h-[500px] object-cover"/>`:''}<div class="flex gap-6 pt-2 border-t"><button class="likeBtn font-bold ${liked?'text-[#ff7a00]':'text-gray-500'}">${liked?'❤️':'🤍'} ${p.likes?.length||0}</button><button class="text-gray-500">💬</button></div>`;
      el.querySelector('.likeBtn').onclick=async()=>{ const ref=doc(db,"posts",id); if(liked) await updateDoc(ref,{likes:arrayRemove(auth.currentUser.uid)}); else await updateDoc(ref,{likes:arrayUnion(auth.currentUser.uid)}); };
      feed.appendChild(el);
    });
  });
}
</script>
</body>
</html>
